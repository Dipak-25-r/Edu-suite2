<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Quiz System – Teacher & Student</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
 tailwind.config = {
  darkMode:'class',
  theme:{extend:{fontFamily:{sans:['Poppins','sans-serif']},colors:{primary:'#58CC02'}}}
 }
</script>

<style>
.fade{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.progress{transition:width .4s}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans">

<!-- ================= TEACHER : CREATE QUIZ ================= -->
<section id="create" class="min-h-screen flex items-center justify-center">
 <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-lg fade">
  <h1 class="text-2xl font-bold text-center mb-4">Create Online Test</h1>
  <input id="quizTitle" placeholder="Quiz Title" class="w-full p-2 border rounded mb-2">
  <input id="timePerQ" type="number" placeholder="Time per Question (sec)" class="w-full p-2 border rounded mb-2">
  <textarea id="questionText" placeholder="Question" class="w-full p-2 border rounded mb-2"></textarea>
  <input id="o1" placeholder="Option A" class="w-full p-2 border rounded mb-1">
  <input id="o2" placeholder="Option B" class="w-full p-2 border rounded mb-1">
  <input id="o3" placeholder="Option C" class="w-full p-2 border rounded mb-1">
  <input id="o4" placeholder="Option D" class="w-full p-2 border rounded mb-2">
  <select id="ans" class="w-full p-2 border rounded mb-2">
   <option value="0">Correct: A</option>
   <option value="1">Correct: B</option>
   <option value="2">Correct: C</option>
   <option value="3">Correct: D</option>
  </select>
  <button onclick="addQuestion()" class="w-full bg-primary text-white py-2 rounded mb-2 pulse">Add Question</button>
  <button onclick="publishQuiz()" class="w-full bg-black text-white py-2 rounded">Publish & Get Link</button>
  <p id="quizLink" class="text-sm text-center mt-3"></p>
 </div>
</section>

<!-- ================= STUDENT INFO ================= -->
<section id="studentInfo" class="hidden min-h-screen flex items-center justify-center">
 <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-md fade">
  <h2 class="text-xl font-bold mb-3 text-center">Student Details</h2>
  <input id="studentName" placeholder="Student Name" class="w-full p-2 border rounded mb-2">
  <input id="studentRoll" placeholder="Roll Number" class="w-full p-2 border rounded mb-3">
  <button onclick="startQuiz()" class="w-full bg-primary text-white py-2 rounded">Start Test</button>
 </div>
</section>

<!-- ================= STUDENT QUIZ ================= -->
<section id="quiz" class="hidden min-h-screen flex items-center justify-center">
 <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-md fade">
  <div class="flex justify-between text-sm mb-2">
   <span id="timer" class="font-bold">⏱️</span>
   <span id="qno"></span>
  </div>
  <div class="w-full bg-gray-200 h-2 rounded mb-3">
   <div id="bar" class="bg-primary h-2 rounded progress" style="width:0%"></div>
  </div>
  <h2 id="question" class="font-bold text-lg mb-3"></h2>
  <div id="options" class="space-y-2"></div>
 </div>
</section>

<!-- ================= RESULT + TEACHER DASHBOARD ================= -->
<section id="result" class="hidden min-h-screen flex items-center justify-center">
 <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-lg fade text-center">
  <h2 class="text-2xl font-bold mb-2">Test Completed 🎉</h2>
  <p id="scoreText" class="text-lg mb-4"></p>
  <h3 class="font-bold mb-2">All Student Results</h3>
  <table class="w-full text-sm border">
   <thead><tr class="bg-gray-200"><th>Name</th><th>Roll</th><th>Score</th></tr></thead>
   <tbody id="resultTable"></tbody>
  </table>
  <button onclick="location.reload()" class="mt-4 bg-primary text-white px-6 py-2 rounded">Back</button>
 </div>
</section>

<script>
let quiz={title:'',questions:[],time:10};
let i=0,score=0,user={},timerInt;

function addQuestion(){
 quiz.title=quizTitle.value||'Quiz';
 quiz.time=+timePerQ.value||10;
 quiz.questions.push({q:questionText.value,o:[o1.value,o2.value,o3.value,o4.value],a:+ans.value});
 questionText.value=o1.value=o2.value=o3.value=o4.value='';
}

function publishQuiz(){
 const code=Math.random().toString(36).substring(2,8);
 localStorage.setItem('quiz_'+code,JSON.stringify(quiz));
 quizLink.innerHTML=`Share Link:<br><b>${location.href.split('?')[0]}?code=${code}</b>`;
}

function startQuiz(){
 user={name:studentName.value,roll:studentRoll.value};
 document.getElementById('studentInfo').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 loadQ();
}

function loadQ(){
 let t=quiz.time;
 timer.innerText=`⏱️ ${t}s`;
 clearInterval(timerInt);
 timerInt=setInterval(()=>{t--;timer.innerText=`⏱️ ${t}s`;if(t<=0){clearInterval(timerInt);check(-1)}},1000);
 const q=quiz.questions[i];
 qno.innerText=`Q ${i+1}/${quiz.questions.length}`;
 question.innerText=q.q;options.innerHTML='';
 bar.style.width=(i/quiz.questions.length)*100+'%';
 q.o.forEach((opt,idx)=>{const b=document.createElement('button');b.className='w-full p-3 border rounded hover:bg-primary hover:text-white transition';b.innerText=opt;b.onclick=()=>check(idx);options.appendChild(b);});
}

function check(a){clearInterval(timerInt);if(a===quiz.questions[i].a)score++;i++;i<quiz.questions.length?loadQ():finish();}

function finish(){
 quiz.classList.add('hidden');result.classList.remove('hidden');
 scoreText.innerText=`${user.name} (${user.roll}) scored ${score}/${quiz.questions.length}`;
 const code=new URLSearchParams(location.search).get('code');
 let r=JSON.parse(localStorage.getItem('results_'+code)||'[]');
 r.push({...user,score});localStorage.setItem('results_'+code,JSON.stringify(r));
 resultTable.innerHTML=r.map(x=>`<tr><td>${x.name}</td><td>${x.roll}</td><td>${x.score}</td></tr>`).join('');
}

const params=new URLSearchParams(location.search);
if(params.get('code')){
 document.getElementById('create').classList.add('hidden');
 document.getElementById('studentInfo').classList.remove('hidden');
 quiz=JSON.parse(localStorage.getItem('quiz_'+params.get('code')));
}
</script>
</body>
</html>
