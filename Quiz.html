<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quiz System</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: { primary: '#58CC02' },
      fontFamily: { sans: ['Poppins', 'sans-serif'] }
    }
  }
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
.fade { animation: fade .4s ease }
@keyframes fade {
  from { opacity:0; transform:translateY(10px) }
  to { opacity:1 }
}
.progress { transition: width .4s }
</style>
</head>

<body class="bg-gray-900 text-gray-100 font-sans">

<!-- ================= ADMIN DASHBOARD ================= -->
<section id="admin" class="hidden p-6">
<h1 class="text-2xl font-bold mb-4">📊 Live Results</h1>
<table class="w-full text-sm border border-gray-700">
<thead class="bg-gray-700">
<tr>
<th>Name</th><th>Roll</th><th>Score</th><th>Status</th>
</tr>
</thead>
<tbody id="liveTable"></tbody>
</table>
</section>

<!-- ================= TEACHER ================= -->
<section id="teacher" class="min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-lg fade">
<h1 class="text-2xl font-bold text-center mb-4">Create Online Quiz</h1>

<input id="quizTitle" placeholder="Quiz Title"
 class="w-full p-2 bg-gray-700 rounded mb-2">

<input id="timePerQ" type="number" placeholder="Time per Question (sec)"
 class="w-full p-2 bg-gray-700 rounded mb-2">

<textarea id="questionText" placeholder="Question"
 class="w-full p-2 bg-gray-700 rounded mb-2"></textarea>

<input id="o1" placeholder="Option A" class="w-full p-2 bg-gray-700 rounded mb-1">
<input id="o2" placeholder="Option B" class="w-full p-2 bg-gray-700 rounded mb-1">
<input id="o3" placeholder="Option C" class="w-full p-2 bg-gray-700 rounded mb-1">
<input id="o4" placeholder="Option D" class="w-full p-2 bg-gray-700 rounded mb-2">

<select id="ans" class="w-full p-2 bg-gray-700 rounded mb-3">
<option value="0">Correct: A</option>
<option value="1">Correct: B</option>
<option value="2">Correct: C</option>
<option value="3">Correct: D</option>
</select>

<button onclick="addQuestion()"
 class="w-full bg-primary text-black py-2 rounded mb-2 font-bold">
Add Question
</button>

<button onclick="publishQuiz()"
 class="w-full bg-black text-white py-2 rounded">
Publish & Get Link
</button>

<p id="quizLink" class="text-sm text-center mt-3"></p>
</div>
</section>

<!-- ================= STUDENT ================= -->
<section id="studentInfo" class="hidden min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-md fade">
<h2 class="text-xl font-bold mb-3 text-center">Student Details</h2>

<input id="studentName" placeholder="Student Name"
 class="w-full p-2 bg-gray-700 rounded mb-2">

<input id="studentRoll" placeholder="Roll Number"
 class="w-full p-2 bg-gray-700 rounded mb-3">

<button onclick="startQuiz()"
 class="w-full bg-primary text-black py-2 rounded font-bold">
Start Test
</button>
</div>
</section>

<!-- ================= QUIZ ================= -->
<section id="quizSection" class="hidden min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-md fade">

<div class="flex justify-between text-sm mb-2">
<span id="timer"></span>
<span id="qno"></span>
</div>

<div class="w-full bg-gray-700 h-2 rounded mb-3">
<div id="bar" class="bg-primary h-2 rounded progress"></div>
</div>

<h2 id="question" class="font-bold text-lg mb-3"></h2>
<div id="options" class="space-y-2"></div>
</div>
</section>

<!-- ================= RESULT ================= -->
<section id="result" class="hidden min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-lg fade text-center">
<h2 class="text-2xl font-bold mb-2">Test Completed 🎉</h2>
<p id="scoreText" class="text-lg mb-4"></p>
<button onclick="location.reload()"
 class="bg-primary text-black px-6 py-2 rounded font-bold">Back</button>
</div>
</section>

<!-- ================= LOGIC + FIREBASE ================= -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
 getFirestore, collection, addDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 PASTE FIREBASE CONFIG HERE */
const firebaseConfig = {
 apiKey: "YOUR_KEY",
 authDomain: "YOUR_DOMAIN",
 projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let quiz={title:'',questions:[],time:10};
let index=0,score=0,timerInt,cheated=false;
let user={};

const params=new URLSearchParams(location.search);
if(params.get('code')){
 teacher.classList.add('hidden');
 studentInfo.classList.remove('hidden');
}

if(location.hash==="#admin"){
 admin.classList.remove('hidden');
 teacher.classList.add('hidden');
 studentInfo.classList.add('hidden');

 onSnapshot(collection(db,"results"),snap=>{
  liveTable.innerHTML="";
  snap.forEach(d=>{
   const r=d.data();
   liveTable.innerHTML+=`
   <tr class="border-b border-gray-700">
    <td>${r.name}</td>
    <td>${r.roll}</td>
    <td>${r.score}</td>
    <td>${r.status}</td>
   </tr>`;
  });
 });
}

window.addQuestion=()=>{
 if(!questionText.value||!o1.value||!o2.value||!o3.value||!o4.value)
  return alert("Fill all fields");

 quiz.title=quizTitle.value||'Quiz';
 quiz.time=+timePerQ.value||10;
 quiz.questions.push({
  q:questionText.value,
  o:[o1.value,o2.value,o3.value,o4.value],
  a:+ans.value
 });
 questionText.value=o1.value=o2.value=o3.value=o4.value='';
}

window.publishQuiz=()=>{
 if(!quiz.questions.length) return alert("Add questions");
 const code=Math.random().toString(36).substring(2,8);
 localStorage.setItem(code,JSON.stringify(quiz));
 quizLink.innerHTML=`Share:<br><b>${location.origin+location.pathname}?code=${code}</b>`;
}

window.startQuiz=()=>{
 user={name:studentName.value,roll:studentRoll.value};
 quiz=JSON.parse(localStorage.getItem(params.get('code')));
 studentInfo.classList.add('hidden');
 quizSection.classList.remove('hidden');
 loadQ();
}

// Anti-cheat
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){ cheated=true; finish(); }
});

function loadQ(){
 const q=quiz.questions[index];
 let t=quiz.time;
 timer.innerText=`⏱ ${t}s`;
 qno.innerText=`Q ${index+1}/${quiz.questions.length}`;
 bar.style.width=((index+1)/quiz.questions.length)*100+'%';
 question.innerText=q.q;
 options.innerHTML='';
 clearInterval(timerInt);
 timerInt=setInterval(()=>{
  t--; timer.innerText=`⏱ ${t}s`;
  if(t<=0){clearInterval(timerInt); submit(-1)}
 },1000);

 q.o.forEach((op,i)=>{
  let b=document.createElement('button');
  b.className="w-full p-3 bg-gray-700 hover:bg-primary hover:text-black rounded";
  b.innerText=op;
  b.onclick=()=>submit(i);
  options.appendChild(b);
 });
}

function submit(a){
 clearInterval(timerInt);
 if(a===quiz.questions[index].a) score++;
 index++;
 index<quiz.questions.length?loadQ():finish();
}

async function finish(){
 quizSection.classList.add('hidden');
 result.classList.remove('hidden');
 scoreText.innerText=
 `${user.name} (${user.roll}) scored ${score}/${quiz.questions.length}`;

 await addDoc(collection(db,"results"),{
  ...user,
  score,
  status: cheated?"CHEATED":"OK",
  time:Date.now()
 });
}
</script>

</body>
</html>
