<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Quiz System (Teacher & Student)</title>

<!-- Tailwind -->

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script>
 tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Poppins', 'sans-serif'] },
      colors: { primary: '#58CC02' }
    }
  }
 }
</script>

<style>
.fade { animation: fade .4s ease }
@keyframes fade { from {opacity:0; transform:translateY(10px)} to {opacity:1} }
.progress { transition: width .4s }
</style>

</head>
<body class="bg-gray-100 font-sans">

<!-- ================= TEACHER CREATE ================= -->

<section id="teacher" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg fade">
    <h1 class="text-2xl font-bold text-center mb-4">Create Online Quiz</h1>
    <input id="quizTitle" placeholder="Quiz Title" class="w-full p-2 border rounded mb-2">
    <input id="timePerQ" type="number" placeholder="Time per Question (sec)" class="w-full p-2 border rounded mb-2">
    <textarea id="questionText" placeholder="Question" class="w-full p-2 border rounded mb-2"></textarea>
    <input id="o1" placeholder="Option A" class="w-full p-2 border rounded mb-1">
    <input id="o2" placeholder="Option B" class="w-full p-2 border rounded mb-1">
    <input id="o3" placeholder="Option C" class="w-full p-2 border rounded mb-1">
    <input id="o4" placeholder="Option D" class="w-full p-2 border rounded mb-2">
    <select id="ans" class="w-full p-2 border rounded mb-3">
      <option value="0">Correct: A</option>
      <option value="1">Correct: B</option>
      <option value="2">Correct: C</option>
      <option value="3">Correct: D</option>
    </select>
    <button onclick="addQuestion()" class="w-full bg-primary text-white py-2 rounded mb-2">Add Question</button>
    <button onclick="publishQuiz()" class="w-full bg-black text-white py-2 rounded">Publish & Get Link</button>
    <p id="quizLink" class="text-sm text-center mt-3"></p>
  </div>
</section>

<!-- ================= STUDENT INFO ================= -->

<section id="studentInfo" class="hidden min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md fade">
    <h2 class="text-xl font-bold mb-3 text-center">Student Details</h2>
    <input id="studentName" placeholder="Student Name" class="w-full p-2 border rounded mb-2">
    <input id="studentRoll" placeholder="Roll Number" class="w-full p-2 border rounded mb-3">
    <button onclick="startQuiz()" class="w-full bg-primary text-white py-2 rounded">Start Test</button>
  </div>
</section>

<!-- ================= QUIZ ================= -->

<section id="quizSection" class="hidden min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md fade">
    <div class="flex justify-between text-sm mb-2">
      <span id="timer"></span>
      <span id="qno"></span>
    </div>
    <div class="w-full bg-gray-200 h-2 rounded mb-3">
      <div id="bar" class="bg-primary h-2 rounded progress" style="width:0%"></div>
    </div>
    <h2 id="question" class="font-bold text-lg mb-3"></h2>
    <div id="options" class="space-y-2"></div>
  </div>
</section>

<!-- ================= RESULT ================= -->

<section id="result" class="hidden min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg fade text-center">
    <h2 class="text-2xl font-bold mb-2">Test Completed 🎉</h2>
    <p id="scoreText" class="text-lg mb-4"></p>
    <table class="w-full text-sm border">
      <thead><tr class="bg-gray-200"><th>Name</th><th>Roll</th><th>Score</th></tr></thead>
      <tbody id="resultTable"></tbody>
    </table>
    <button onclick="location.reload()" class="mt-4 bg-primary text-white px-6 py-2 rounded">Back</button>
  </div>
</section>

<!-- ================= FIREBASE + LOGIC ================= -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDrK20CbFxWH2V6iS8EPfXSAjD2RDvxKQo",
  authDomain: "online-quiz-f51dc.firebaseapp.com",
  projectId: "online-quiz-f51dc",
  storageBucket: "online-quiz-f51dc.firebasestorage.app",
  messagingSenderId: "676955998340",
  appId: "1:676955998340:web:e22fd3fb6ec49549de9ad1",
  measurementId: "G-9J6WK672J6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let quiz = { title:'', questions:[], time:10 };
let index = 0, score = 0, timerInt;
let user = {};
let quizCode = null;

window.addQuestion = () => {
  if(!questionText.value) return alert('Add question');
  quiz.title = quizTitle.value || 'Quiz';
  quiz.time = +timePerQ.value || 10;
  quiz.questions.push({
    q: questionText.value,
    o: [o1.value,o2.value,o3.value,o4.value],
    a: +ans.value
  });
  questionText.value=o1.value=o2.value=o3.value=o4.value='';
}

window.publishQuiz = async () => {
  if(quiz.questions.length === 0) return alert('Add at least one question');
  quizCode = Math.random().toString(36).substring(2,8);
  await setDoc(doc(db,'quizzes',quizCode), quiz);
  quizLink.innerHTML = `Share Link:<br><b>${location.origin + location.pathname}?code=${quizCode}</b>`;
}

window.startQuiz = () => {
  user = { name: studentName.value, roll: studentRoll.value };
  document.getElementById('studentInfo').classList.add('hidden');
  document.getElementById('quizSection').classList.remove('hidden');
  loadQ();
}

function loadQ(){
  const q = quiz.questions[index];
  let t = quiz.time;
  timer.innerText = `⏱ ${t}s`;
  qno.innerText = `Q ${index+1}/${quiz.questions.length}`;
  bar.style.width = (index/quiz.questions.length)*100 + '%';
  question.innerText = q.q;
  options.innerHTML='';

  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    t--; timer.innerText=`⏱ ${t}s`;
    if(t<=0){ clearInterval(timerInt); submit(-1); }
  },1000);

  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='w-full p-3 border rounded hover:bg-primary hover:text-white';
    b.innerText=opt;
    b.onclick=()=>submit(i);
    options.appendChild(b);
  });
}

async function submit(ans){
  clearInterval(timerInt);
  if(ans === quiz.questions[index].a) score++;
  index++;
  index < quiz.questions.length ? loadQ() : finish();
}

async function finish(){
  quizSection.classList.add('hidden');
  result.classList.remove('hidden');
  scoreText.innerText = `${user.name} (${user.roll}) scored ${score}/${quiz.questions.length}`;

  const ref = doc(db,'results',quizCode);
  const snap = await getDoc(ref);
  if(snap.exists()){
    await updateDoc(ref,{ list: arrayUnion({...user,score}) });
  } else {
    await setDoc(ref,{ list:[{...user,score}] });
  }

  const data = (await getDoc(ref)).data().list;
  resultTable.innerHTML = data.map(x=>`<tr><td>${x.name}</td><td>${x.roll}</td><td>${x.score}</td></tr>`).join('');
}

// LOAD STUDENT MODE
const params = new URLSearchParams(location.search);
if(params.get('code')){
  quizCode = params.get('code');
  const snap = await getDoc(doc(db,'quizzes',quizCode));
  quiz = snap.data();
  teacher.classList.add('hidden');
  studentInfo.classList.remove('hidden');
}
</script>

</body>
</html>
