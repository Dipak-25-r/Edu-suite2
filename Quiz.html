<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Exam System</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode:'class',
  theme:{extend:{colors:{primary:'#58CC02'}}}
}
</script>

<style>
.fade{animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>

<body class="bg-gray-900 text-white">

<!-- ================= ADMIN DASHBOARD ================= -->
<section id="admin" class="hidden p-6">
<h1 class="text-2xl font-bold mb-4">📊 Live Results Dashboard</h1>
<table class="w-full text-sm border border-gray-700">
<thead class="bg-gray-700">
<tr><th>Name</th><th>Roll</th><th>Score</th><th>Status</th></tr>
</thead>
<tbody id="liveTable"></tbody>
</table>
</section>

<!-- ================= STUDENT ================= -->
<section id="student" class="min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl w-full max-w-md fade">

<h2 class="text-xl font-bold mb-3 text-center">Student Login</h2>
<input id="sname" placeholder="Name" class="w-full p-2 bg-gray-700 mb-2">
<input id="sroll" placeholder="Roll No" class="w-full p-2 bg-gray-700 mb-3">
<button onclick="start()" class="w-full bg-primary text-black py-2 font-bold rounded">
Start Exam
</button>

</div>
</section>

<!-- ================= QUIZ ================= -->
<section id="quiz" class="hidden min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl w-full max-w-md">

<div class="flex justify-between mb-2">
<span id="timer"></span>
<span id="qno"></span>
</div>

<h2 id="question" class="font-bold mb-3"></h2>
<div id="opts" class="space-y-2"></div>

</div>
</section>

<!-- ================= RESULT ================= -->
<section id="result" class="hidden min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-6 rounded-xl text-center">
<h2 class="text-2xl font-bold">Exam Submitted</h2>
<p id="finalScore" class="mt-2"></p>
</div>
</section>

<!-- ================= FIREBASE + LOGIC ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const quizData = {
 questions:[
  {q:"2 + 2 = ?", o:["1","2","3","4"], a:3},
  {q:"Capital of India?", o:["Delhi","Mumbai","Pune","Goa"], a:0}
 ],
 time:10
};

let i=0, score=0, tInt, cheated=false;
let user={};

function start(){
 if(!sname.value || !sroll.value) return alert("Fill details");
 user={name:sname.value, roll:sroll.value};

 student.classList.add('hidden');
 quiz.classList.remove('hidden');
 loadQ();
}

// Anti-cheat
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  cheated=true;
  finish();
 }
});

function loadQ(){
 const q=quizData.questions[i];
 let t=quizData.time;

 qno.innerText=`Q ${i+1}/${quizData.questions.length}`;
 question.innerText=q.q;
 opts.innerHTML="";
 timer.innerText=`⏱ ${t}s`;

 clearInterval(tInt);
 tInt=setInterval(()=>{
  t--; timer.innerText=`⏱ ${t}s`;
  if(t<=0){clearInterval(tInt); submit(-1)}
 },1000);

 q.o.forEach((op,idx)=>{
  let b=document.createElement("button");
  b.className="w-full p-2 bg-gray-700 rounded hover:bg-primary hover:text-black";
  b.innerText=op;
  b.onclick=()=>submit(idx);
  opts.appendChild(b);
 });
}

function submit(ans){
 clearInterval(tInt);
 if(ans===quizData.questions[i].a) score++;
 i++;
 i<quizData.questions.length ? loadQ() : finish();
}

async function finish(){
 quiz.classList.add('hidden');
 result.classList.remove('hidden');

 finalScore.innerText =
 `${user.name} scored ${score}/${quizData.questions.length}`;

 await addDoc(collection(db,"results"),{
  ...user,
  score,
  status: cheated ? "CHEATED" : "OK",
  time: Date.now()
 });
}

// ADMIN MODE
if(location.hash==="#admin"){
 admin.classList.remove("hidden");
 student.classList.add("hidden");

 onSnapshot(collection(db,"results"),snap=>{
  liveTable.innerHTML="";
  snap.forEach(d=>{
   const r=d.data();
   liveTable.innerHTML+=
   `<tr class="border-b border-gray-700">
     <td>${r.name}</td>
     <td>${r.roll}</td>
     <td>${r.score}</td>
     <td>${r.status}</td>
   </tr>`;
  });
 });
}
</script>

</body>
</html>
